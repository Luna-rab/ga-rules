name: CI

# main への push では deploy.yml がこのワークフローを呼ぶ。
on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # oxlint は型を見て infra/ もリントするので、check の前に infra/ の依存も入れる。
      - run: bun install --frozen-lockfile --cwd infra
      - run: bun run check
      # src/server のテストは索引が要るので CI では流さないが、これは索引を使わない。
      - run: bun test src/server/rate-limit.test.ts
      - run: bun run --cwd infra typecheck
